[package]
name = "radar-ops"
version = "0.1.14"
description = "雷达平台运维端"
authors = ["lihu"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "radar_ops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
# 和 plugin-http 用的是同一个 reqwest，这里只为打开响应压缩（请求自动带 Accept-Encoding 并解压），大列表传输量能小很多
reqwest = { version = "0.12", default-features = false, features = ["gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 自动更新：从 R2 上的 latest.json 检查新版本，下载后校验签名再安装；process 用于装完后重启
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
