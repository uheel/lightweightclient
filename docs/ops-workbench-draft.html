<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>运维端工作台草稿</title>
<style>
:root{--navy:#111441;--navy2:#1d2160;--blue:#3b5bdb;--ink:#1f2537;--muted:#6b7389;--line:#e3e6ee;--bg:#f4f5f9;--card:#fff;--green:#1f9d63;--amber:#c27a12;--red:#d64545}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:default}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 标题栏 = 标签栏：一行 40px，像浏览器 */
.chrome{height:40px;background:var(--navy);color:#cfd3f5;display:flex;align-items:stretch;padding-left:10px;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;color:#fff;padding-right:12px}
.logo{width:18px;height:18px;border-radius:50%;border:2px solid #8da2ff;position:relative}.logo:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#8da2ff}
.org{display:flex;align-items:center;gap:4px;padding:0 10px;margin:8px 6px 8px 0;border-radius:6px;background:rgba(255,255,255,.08);color:#e6e8ff;font-size:12px}
.org:hover{background:rgba(255,255,255,.15)}
.tabs{display:flex;align-items:flex-end;gap:2px;flex:1;min-width:0;overflow:hidden;padding-top:6px}
.tab{display:flex;align-items:center;gap:7px;height:34px;padding:0 8px 0 12px;border-radius:8px 8px 0 0;max-width:200px;min-width:0;color:#b7bce6;position:relative;flex:0 1 auto}
.tab:hover{background:rgba(255,255,255,.07);color:#fff}
.tab.on{background:var(--bg);color:var(--ink)}
.tab.home{padding:0 12px}
.tab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .x{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:14px;line-height:1;opacity:.55}
.tab .x:hover{opacity:1;background:rgba(127,127,160,.25)}
.tab .badge{background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:15px}
.tab.child .t:before{content:"↳ ";opacity:.5}
.tab.dragging{opacity:.4}
.right{display:flex;align-items:center;gap:4px;padding:0 4px 0 8px}
.pill{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:6px;font-size:12px}
.pill:hover{background:rgba(255,255,255,.1)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.avatar{width:24px;height:24px;border-radius:50%;background:#3a3f8f;color:#fff;display:grid;place-items:center;font-size:11px}
.win{display:flex;margin-left:6px}.win span{width:42px;height:40px;display:grid;place-items:center;color:#9aa0d0}.win span:hover{background:rgba(255,255,255,.1)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;display:none}.view.on{display:block}

/* 工作台 */
.wb{max-width:1280px;margin:0 auto;padding:26px 32px 40px;display:grid;grid-template-columns:1fr 300px;gap:28px}
.hello h1{font-size:20px;margin:0 0 2px;font-weight:600}.hello p{margin:0;color:var(--muted)}
.group{margin-top:22px}.group h2{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px;position:relative;transition:border-color .12s,box-shadow .12s,transform .12s}
.tile:hover{border-color:#b9c3f3;box-shadow:0 4px 14px rgba(30,40,120,.08);transform:translateY(-1px)}
.tile .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.tile .ic svg{width:19px;height:19px}
.tile b{font-size:14px;font-weight:600}
.tile small{color:var(--muted);font-size:12px;margin-top:auto}
.tile .flag{position:absolute;top:12px;right:12px;font-size:11px;padding:1px 7px;border-radius:9px}
.flag.warn{background:#fff3df;color:var(--amber)}.flag.bad{background:#fde8e8;color:var(--red)}.flag.ok{background:#e4f6ec;color:var(--green)}
.tile.open:after{content:"已打开";position:absolute;bottom:12px;right:12px;font-size:11px;color:var(--blue)}
.tile.dark{background:linear-gradient(135deg,#151a4d,#0d1033);border-color:#151a4d;color:#e8eaff}.tile.dark small{color:#9ea6dd}.tile.dark .ic{background:rgba(255,255,255,.1)!important;color:#9fb1ff!important}
.tile.wide{grid-column:span 2}
.side h3{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:.5px}
.todo{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.todo button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
.todo button:last-child{border-bottom:0}.todo button:hover{background:#f6f7fc}
.todo .n{font-weight:600;min-width:22px}.todo .go{margin-left:auto;color:var(--muted);font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.7}
kbd{font:11px Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}

/* 模块页占位 */
.page{padding:18px 22px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px}.ph h1{font-size:17px;margin:0;font-weight:600}.ph .sub{color:var(--muted)}
.ph .grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 12px}.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px;height:calc(100vh - 40px - 90px)}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto}
.search{width:calc(100% - 20px);margin:10px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;user-select:text}
.row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #f0f1f5}
.row:hover{background:#f6f7fc}.row.sel{background:#eef1ff}
.row .sn{color:var(--muted);font-size:11px;margin-left:auto;font-family:Consolas,monospace}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:30px}
.filterchip{background:#eef1ff;color:var(--blue);border-radius:12px;padding:1px 10px;font-size:12px}

/* 监控标签：深色 */
.view.dark{background:#0b0e2a;color:#dfe3ff}
.mon{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.room{background:#151a45;border:1px solid #232a63;border-radius:8px;padding:10px 12px;min-height:84px}
.room b{font-weight:600}.room small{display:block;color:#8d95cc;margin-top:6px}
.room.alarm{border-color:#e05555;box-shadow:0 0 0 1px #e05555 inset;background:#2a1530}
.monbar{display:flex;align-items:center;gap:12px;padding:12px 20px 0}.monbar .grow{flex:1}
.monbar .btn{background:#1b2156;border-color:#2b3374;color:#dfe3ff}

.menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;display:none;z-index:9;min-width:150px}
.menu button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:5px}.menu button:hover{background:#f0f2fb}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@media(max-width:900px){.wb{grid-template-columns:1fr}.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="chrome">
  <div class="brand"><span class="logo"></span>Radar Config</div>
  <button class="org" title="切换机构">李虎测试机构 ▾</button>
  <nav class="tabs" id="tabs"></nav>
  <div class="right">
    <button class="pill" title="实时连接"><i class="dot"></i>实时</button>
    <button class="pill" title="快速开始">快速开始 2/6</button>
    <button class="pill"><span class="avatar">李</span></button>
  </div>
  <div class="win"><span>—</span><span>☐</span><span>✕</span></div>
</div>
<main id="main"></main>
<div class="menu" id="menu">
  <button data-m="close">关闭</button><button data-m="others">关闭其他标签</button><button data-m="right">关闭右侧标签</button><hr><button data-m="all">全部关闭（回到工作台）</button>
</div>

<script>
const P={
 home:'M3 11l9-7 9 7v9H3z M9 20v-6h6v6',
 monitor:'M3 4h18v12H3z M8 20h8 M12 16v4 M6 12l3-3 3 2 5-5',
 devices:'M6 3h12v18H6z M9 7h6 M9 11h6 M11 17h2',
 spaces:'M4 21V8l8-5 8 5v13 M9 21v-5h6v5 M8 10h1 M15 10h1',
 scenes:'M9 3h6v5H9z M3 16h6v5H3z M15 16h6v5h-6z M12 8v4 M6 16v-4h12v4',
 members:'M9 11a4 4 0 100-8 4 4 0 000 8z M2 21v-2a6 6 0 0112 0v2 M16 3.5a4 4 0 010 7.5 M18 14a5 5 0 014 5v2',
 alerts:'M12 3a6 6 0 00-6 6v4l-2 3h16l-2-3V9a6 6 0 00-6-6z M10 19a2 2 0 004 0',
 rooms:'M4 4h16v16H4z M4 12h8 M12 4v16 M16 8h1',
 realtime:'M4 12a8 8 0 0116 0 M7.5 12a4.5 4.5 0 019 0 M12 12v8'
};
const ic=k=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[k]}"/></svg>`;
const M={
 monitor:{name:'实时监控',meta:'32 个房间 · 1 条告警进行中',flag:['bad','告警 1'],c:'#e9ecff',k:'#3b5bdb',dark:true,wide:true},
 alerts:{name:'告警记录',meta:'今日 12 条 · 未处理 2',flag:['warn','未处理 2'],c:'#fdeceb',k:'#d64545'},
 devices:{name:'设备管理',meta:'38 台 · 离线 3',flag:['warn','离线 3'],c:'#e9ecff',k:'#3b5bdb'},
 spaces:{name:'楼栋管理',meta:'2 栋 · 9 层 · 64 间',c:'#e6f5ee',k:'#1f9d63'},
 scenes:{name:'场景下发',meta:'5 个场景 · 2 台待下发',flag:['warn','待下发 2'],c:'#f3ecfd',k:'#7b4bd6'},
 members:{name:'长者档案',meta:'41 位在住',c:'#fff3df',k:'#c27a12'},
 rooms:{name:'房间诊断',meta:'64 间 · 4 间有问题',flag:['warn','问题 4'],c:'#e6f3f7',k:'#1e83a3'},
 realtime:{name:'实时推送',meta:'SignalR 已连接',flag:['ok','正常'],c:'#eef0f4',k:'#59627a'}
};
const GROUPS=[['日常值守',['monitor','alerts']],['安装部署',['devices','spaces','scenes','members']],['排查',['rooms','realtime']]];

let tabs=[{id:'home'}];let active='home';const views={};
const main=document.getElementById('main');

function tabTitle(t){if(t.id==='home')return'工作台';if(t.parent)return t.title;return M[t.id].name}
function renderTabs(){
 document.getElementById('tabs').innerHTML=tabs.map(t=>{
  const home=t.id==='home';const m=M[t.parent||t.id];
  const badge=t.id==='alerts'&&active!=='alerts'?'<span class="badge">2</span>':'';
  return `<div class="tab ${home?'home':''} ${t.parent?'child':''} ${t.id===active?'on':''}" draggable="${!home}" data-tab="${t.id}" title="${tabTitle(t)}">
   ${ic(home?'home':(t.parent||t.id))}<span class="t">${tabTitle(t)}</span>${badge}${home?'':'<span class="x" data-x="'+t.id+'">×</span>'}</div>`}).join('');
 for(const id in views)views[id].classList.toggle('on',id===active);
 document.querySelectorAll('.tile').forEach(el=>el.classList.toggle('open',tabs.some(t=>t.id===el.dataset.open)));
}
function open(id,extra){
 if(!tabs.some(t=>t.id===id)){
  const t={id,...extra};
  // 子标签插在父标签后面
  const at=extra&&extra.parent?tabs.findIndex(x=>x.id===extra.parent)+1:tabs.length;
  tabs.splice(at,0,t);
  views[id]=build(t);main.appendChild(views[id]);
 }
 active=id;
 if(extra&&extra.filter){views[id].querySelector('.fc').innerHTML=`<span class="filterchip">筛选：${extra.filter} ✕</span>`}
 renderTabs();
}
function close(id){
 if(id==='home')return;const i=tabs.findIndex(t=>t.id===id);if(i<0)return;
 // 关闭父标签时一起关闭它的子标签
 const gone=tabs.filter(t=>t.id===id||t.parent===id).map(t=>t.id);
 tabs=tabs.filter(t=>!gone.includes(t.id));gone.forEach(g=>{views[g].remove();delete views[g]});
 if(gone.includes(active))active=(tabs[Math.min(i,tabs.length)-1]||tabs[0]).id;
 renderTabs();
}

function build(t){
 const v=document.createElement('section');v.className='view';v.dataset.id=t.id;
 if(t.id==='home')v.innerHTML=home();
 else if(t.id==='monitor'){v.classList.add('dark');v.innerHTML=monitor()}
 else if(t.parent)v.innerHTML=detail(t);
 else v.innerHTML=listPage(t.id);
 return v;
}
function home(){
 return `<div class="wb"><div>
  <div class="hello"><h1>下午好，李虎</h1><p>李虎测试机构 · 10 月 26 日 星期一</p></div>
  ${GROUPS.map(([g,ids])=>`<div class="group"><h2>${g}</h2><div class="tiles">${ids.map(id=>{const m=M[id];return `<button class="tile ${m.dark?'dark':''} ${m.wide?'wide':''}" data-open="${id}">
    <span class="ic" style="background:${m.c};color:${m.k}">${ic(id)}</span><b>${m.name}</b><small>${m.meta}</small>${m.flag?`<span class="flag ${m.flag[0]}">${m.flag[1]}</span>`:''}</button>`}).join('')}</div></div>`).join('')}
 </div>
 <aside class="side">
  <h3>需要处理</h3>
  <div class="todo">
   <button data-open="alerts" data-filter="未处理"><span class="n" style="color:var(--red)">2</span>条告警未处理<span class="go">告警记录 →</span></button>
   <button data-open="devices" data-filter="离线"><span class="n" style="color:var(--amber)">3</span>台设备离线<span class="go">设备管理 →</span></button>
   <button data-open="scenes" data-filter="待下发"><span class="n" style="color:var(--amber)">2</span>台设备场景待下发<span class="go">场景下发 →</span></button>
   <button data-open="rooms" data-filter="有问题"><span class="n" style="color:var(--amber)">4</span>间房间检查有问题<span class="go">房间诊断 →</span></button>
  </div>
  <h3>操作</h3>
  <p class="note">单击方块打开模块；已打开的模块再点只切换过去，不重复开。<br>
  标签可拖动排序；中键或 <kbd>Ctrl</kbd>+<kbd>W</kbd> 关闭；右键有"关闭其他"。<br>
  <kbd>Ctrl</kbd>+<kbd>Tab</kbd> 切换标签；<kbd>Ctrl</kbd>+<kbd>1</kbd> 回到工作台。<br>
  切换标签不会丢失页面里的筛选、选中和滚动位置。<br>
  在设备管理里点一台设备，会在"设备管理"后面开一个子标签。</p>
 </aside></div>`;
}
function listPage(id){
 const m=M[id];
 const rows=Array.from({length:14},(_,i)=>`<div class="row" data-dev="${i}">${ic(id)}<span>${['1号楼','2号楼'][i%2]} ${3+(i>>2)}层 ${301+i} ${id==='members'?'· 王**':'· 卧室雷达'}</span><span class="sn">${id==='devices'?'QL'+(5800+i*37).toString(16).toUpperCase():''}</span></div>`).join('');
 return `<div class="page"><div class="ph"><h1>${m.name}</h1><span class="sub">${m.meta}</span><span class="fc"></span><span class="grow"></span><button class="btn">刷新</button><button class="btn pri">新建</button></div>
 <div class="split"><div class="panel"><input class="search" placeholder="搜索（切走再回来仍保留）">${rows}</div>
 <div class="panel"><div class="empty">现有的 ${m.name} 页面内容放在这里<br><small>${id==='devices'?'单击左侧设备 → 打开子标签':'本草稿只示意外壳'}</small></div></div></div></div>`;
}
function detail(t){
 return `<div class="page"><div class="ph"><h1>${t.title}</h1><span class="sub">1号楼 · 3层</span><span class="grow"></span><button class="btn">配置</button></div>
 <div class="panel" style="height:calc(100vh - 130px)"><div class="empty">现有 DeviceDetail（属性 / 区域 / 角度 / 告警 / 日志）放在这里</div></div></div>`;
}
function monitor(){
 const rooms=Array.from({length:32},(_,i)=>{const a=i===6;return `<div class="room ${a?'alarm':''}"><b>${301+i}</b>${a?' <span style="color:#ff8a8a">跌倒告警</span>':''}<small>${a?'1 人 · 2 分钟前':['在床','离床','无人','在床 · 睡眠'][i%4]}</small></div>`}).join('');
 return `<div class="monbar"><b style="font-size:15px">实时监控</b><span style="color:#8d95cc">32 间 · 在线 31</span><span class="grow"></span><button class="btn">时间回溯</button><button class="btn">全屏 F11</button></div><div class="mon">${rooms}</div>`;
}

// 事件
document.addEventListener('click',e=>{
 hideMenu();
 const x=e.target.closest('[data-x]');if(x){e.stopPropagation();return close(x.dataset.x)}
 const t=e.target.closest('[data-tab]');if(t)return open(t.dataset.tab);
 const o=e.target.closest('[data-open]');if(o)return open(o.dataset.open,o.dataset.filter?{filter:o.dataset.filter}:undefined);
 const d=e.target.closest('[data-dev]');
 if(d){const v=d.closest('.view');v.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',r===d));
  if(v.dataset.id==='devices'){const n=+d.dataset.dev;open('dev-'+n,{parent:'devices',title:`${301+n} 卧室雷达`})}}
});
document.addEventListener('auxclick',e=>{const t=e.target.closest('[data-tab]');if(t&&e.button===1)close(t.dataset.tab)});
const menu=document.getElementById('menu');let menuFor=null;
function hideMenu(){menu.style.display='none'}
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-tab]');if(!t)return;e.preventDefault();menuFor=t.dataset.tab;menu.style.left=e.clientX+'px';menu.style.top=e.clientY+'px';menu.style.display='block'});
menu.addEventListener('click',e=>{const m=e.target.dataset.m;if(!m)return;const i=tabs.findIndex(t=>t.id===menuFor);
 const ids=m==='close'?[menuFor]:m==='others'?tabs.filter(t=>t.id!==menuFor&&t.parent!==menuFor&&tabs.find(x=>x.id===menuFor).parent!==t.id).map(t=>t.id):m==='right'?tabs.slice(i+1).map(t=>t.id):tabs.map(t=>t.id);
 ids.forEach(close);if(m==='others')open(menuFor);hideMenu()});
document.addEventListener('keydown',e=>{
 if(e.ctrlKey&&e.key.toLowerCase()==='w'){e.preventDefault();close(active)}
 if(e.ctrlKey&&e.key==='Tab'){e.preventDefault();const i=tabs.findIndex(t=>t.id===active);open(tabs[(i+(e.shiftKey?-1:1)+tabs.length)%tabs.length].id)}
 if(e.ctrlKey&&e.key==='1'){e.preventDefault();open('home')}
});
// 拖动排序
let dragId=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-tab]');if(!t)return;dragId=t.dataset.tab;t.classList.add('dragging')});
document.addEventListener('dragend',()=>{dragId=null;renderTabs()});
document.addEventListener('dragover',e=>{const t=e.target.closest('[data-tab]');if(!t||!dragId||t.dataset.tab===dragId||t.dataset.tab==='home')return;e.preventDefault();
 const from=tabs.findIndex(x=>x.id===dragId),to=tabs.findIndex(x=>x.id===t.dataset.tab);const [m]=tabs.splice(from,1);tabs.splice(to,0,m);renderTabs();document.querySelector(`[data-tab="${dragId}"]`).classList.add('dragging')});

views.home=build({id:'home'});main.appendChild(views.home);renderTabs();
</script>
</body>
</html>
