function openModule(id){if(!modules.some(m=>m.id===id))return;if(!opened.includes(id))opened.push(id);active=id;render()}
function closeTab(id){const i=opened.indexOf(id);opened=opened.filter(k=>k!==id);if(active===id)active=opened[Math.max(0,i-1)]||'home';render()}
function render(){document.getElementById('status-page').textContent=active==='home'?'工作台':modules.find(m=>m.id===active).title;document.getElementById('tabs').innerHTML=`<div class="tab home-tab ${active==='home'?'active':''}"><button class="tab-open" data-tab="home" ${active==='home'?'aria-current="page"':''}>${icon('home')}工作台</button></div>`+opened.map(id=>{const m=modules.find(x=>x.id===id);return `<div class="tab ${active===id?'active':''}"><button class="tab-open" data-tab="${id}" ${active===id?'aria-current="page"':''}>${icon(id)}${m.title}</button><button class="tab-close" data-close="${id}" aria-label="关闭${m.title}">×</button></div>`}).join('');content.innerHTML=active==='home'?home():active==='devices'?devices():active==='spaces'?spaces():active==='monitor'?monitor():generic(active);}
function home(){return `<div class="welcome"><div><h1>工作台</h1><p>选择功能模块开始工作</p></div><div class="date"><b>安和养老中心</b>运维工作空间</div></div><div class="section-title"><h2>功能模块 <span class="count">8</span></h2><span class="quiet">单击打开 · 顶部标签切换</span></div><div class="home-layout"><div class="modules">${modules.map(m=>`<button class="module" data-open="${m.id}" title="${m.desc}" style="--tone:${m.color};--tint:${m.tint}"><div class="module-top"><span class="module-icon">${icon(m.id)}</span>${m.badge?`<span class="badge">${m.badge}</span>`:''}</div><h2>${m.name}</h2><div class="module-foot"><span>${m.meta}</span></div></button>`).join('')}</div><aside class="workspace-summary" style="display:none"><h2>运行状态</h2><div class="summary-line"><i class="dot ok"></i>25 / 28 台设备在线<button data-open="devices">查看设备</button></div><div class="summary-line"><i class="dot warn"></i>3 台设备需要检查<button data-open="rooms">打开诊断</button></div><div class="summary-line"><i class="dot warn"></i>2 条告警未处理<button data-open="alerts">查看记录</button></div><div class="summary-divider"></div><h2>工作空间</h2><div class="shortcut"><span>返回工作台</span><kbd>Alt + Home</kbd></div><div class="shortcut"><span>关闭当前标签</span><kbd>Alt + W</kbd></div><p>模块在独立标签中打开。
可同时打开多个模块，随时切换。</p></aside></div><div class="bottom-note"><span>点击模块打开页面；关闭全部标签后自动返回工作台。</span><div class="help"><button class="text-btn" data-help>使用说明</button></div></div>`}

function title(id,sub,action=''){const m=modules.find(x=>x.id===id);return `<div class="page-title"><div><div class="eyebrow">WORKSPACE / ${m.id.toUpperCase()}</div><h1>${m.title}</h1><p>${sub}</p></div>${action}</div>`}
function stats(items){return `<div class="stats">${items.map(x=>`<div class="stat"><small>${x[0]}</small><strong class="${x[2]||''}">${x[1]}<em>${x[3]||''}</em></strong></div>`).join('')}</div>`}
function status(warn=false){return `<span class="tag ${warn?'warn':''}"><i class="dot"></i>${warn?'待检查':'在线'}</span>`}
function devices(){return `${title('devices','管理设备状态，完成安装校准与日常排查。','<button class="btn primary" data-demo="添加设备">＋ 添加设备</button>')}${stats([['全部设备','28','','台'],['在线设备','25','ok','台'],['需要检查','3','warn','台'],['今日新增','2','','台']])}<div class="toolbar"><input id="device-search" class="input" placeholder="搜索设备名称 / SN" aria-label="搜索设备"><select id="device-status" class="input" style="min-width:130px"><option value="all">全部状态</option><option value="online">在线</option><option value="warn">待检查</option></select><span class="grow"></span><button class="btn" data-demo="设备列表已刷新">↻ 刷新</button></div><div class="panel table-wrap"><table><thead><tr><th>设备名称 / SN</th><th>安装位置</th><th>状态</th><th>最近心跳</th><th>安装检查</th><th>操作</th></tr></thead><tbody id="device-rows">${deviceRows()}</tbody></table><div class="table-foot"><span id="device-count">显示 8 台示例设备</span><span>共 28 台设备</span></div></div>`}
function deviceRows(query='',filter='all'){return Array.from({length:8},(_,i)=>{let w=i===0||i===5||i===7;let name=`${301+i}房 · 卧室雷达`,sn=`RD202603010${i+1}`;if(query&&!`${name}${sn}`.toLowerCase().includes(query.toLowerCase()))return '';if(filter==='online'&&w||filter==='warn'&&!w)return '';return `<tr><td><b>${name}</b><small>${sn}</small></td><td>1号楼 / 3层 / ${301+i}房</td><td>${status(w)}</td><td>${12+i*3} 秒前</td><td class="${w?'warn':'ok'}">${w?'安装角度待校准':'检查正常'}</td><td><button class="text-btn" data-device="${i}">查看详情</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">未找到匹配设备</td></tr>'}
function filterDevices(){document.getElementById('device-rows').innerHTML=deviceRows(document.getElementById('device-search').value,document.getElementById('device-status').value)}
function spaces(){return `${title('spaces','以空间为中心，管理房间、床位与关联设备。','<button class="btn primary" data-demo="新建楼宇">＋ 新建楼宇</button>')}${stats([['楼宇数量','3','','栋'],['房间数量','48','','间'],['床位数量','72','','张'],['已入住','36','','人']])}<div class="building-grid">${['1号楼','2号楼','康养楼'].map((n,i)=>`<div class="panel building"><div class="building-visual"><i></i><i></i><i></i></div><h2>${n}</h2><p>${i===2?'2':'4'} 个楼层 · 16 个房间 · 24 张床位</p><span class="tag">空间资料完整</span><button class="btn" data-demo="${n} · 楼层与房间管理">管理楼层与房间 →</button></div>`).join('')}</div>`}
function plan(){return `<svg viewBox="0 0 480 270" role="img" aria-label="301房平面图，右侧床位有人在床"><defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#e8ecf4" stroke-width=".6"/></pattern></defs><rect x="28" y="20" width="424" height="226" fill="url(#grid)" stroke="#8c98ac" stroke-width="5"/><path d="M190 246h70" stroke="#fafbfe" stroke-width="7"/><path d="M190 246v-60a60 60 0 0 1 60 60" fill="none" stroke="#9ba5b6"/><g fill="#edf0f6" stroke="#b1bbcd"><rect x="68" y="74" width="92" height="132" rx="6"/><rect x="320" y="74" width="92" height="132" rx="6"/><rect x="76" y="83" width="76" height="28" rx="4" fill="white"/><rect x="328" y="83" width="76" height="28" rx="4" fill="white"/></g><path d="M240 30L90 210Q240 255 390 210Z" fill="#5378ee" opacity=".09"/><path d="M155 130Q240 182 325 130" stroke="#a9baf4" fill="none" stroke-dasharray="4 4"/><rect x="223" y="22" width="34" height="12" rx="6" fill="white" stroke="#9aa9ca"/><circle cx="366" cy="143" r="10" fill="#29a58b"/><rect x="357" y="158" width="18" height="26" rx="7" fill="#29a58b"/><rect x="342" y="190" width="49" height="22" rx="11" fill="#e2f4ee"/><text x="366" y="205" text-anchor="middle" font-size="12" fill="#19885c">在床</text></svg>`}
function monitor(){return `${title('monitor','持续关注房间状态，及时发现需要处理的事件。','<button class="btn" data-open="alerts">查看告警记录 →</button>')}${stats([['监测房间','24','','间'],['当前在床','18','ok','人'],['待关注事件','2','warn','条'],['在线设备','25 / 28','','台']])}<div class="monitor-grid"><div class="panel"><div class="panel-head"><h2>房间状态</h2><span class="quiet">1号楼 · 3层</span></div><div class="room-grid">${Array.from({length:6},(_,i)=>`<div class="room ${i===4?'warning':''}"><b>${301+i} 房</b><div class="${i===4?'warn':'ok'}">${i===4?'离床待关注':i===2?'无人':'在床'}</div><span>卧室雷达 · ${i===4?'离床 15 分钟':'设备在线'}</span></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><h2>301房 · 实时状态</h2><span class="tag"><i class="dot"></i>实时</span></div><div class="plan">${plan()}</div><div class="legend"><span>● 人员位置</span><span>◌ 雷达覆盖范围</span><span style="margin-left:auto">更新于 14:32:08</span></div></div></div><div class="notice"><span class="warn">●</span>305 房离床时间较长，请关注长者状态。<button class="text-btn" data-open="alerts">查看记录 →</button></div>`}
function generic(id){if(id==='alerts')return `${title(id,'按时间与状态查询设备、人员及系统告警。')}${stats([['今日告警','12','','条'],['未处理','2','warn','条'],['已处理','10','ok','条'],['设备异常','3','','台']])}<div class="toolbar"><select class="input" aria-label="告警状态"><option>全部状态</option><option>未处理</option><option>已处理</option></select><button class="btn" data-demo="告警记录已刷新">↻ 刷新</button></div><div class="panel table-wrap"><table><thead><tr><th>时间</th><th>告警事件</th><th>位置</th><th>状态</th></tr></thead><tbody>${['长时间离床','安装角度偏离','设备离线','设备重新上线'].map((s,i)=>`<tr><td>2026-10-25 14:${32-i*3}:08</td><td>${s}</td><td>1号楼 / 3层 / ${305+i}房</td><td><span class="tag ${i<2?'warn':''}">${i<2?'未处理':'已处理'}</span></td></tr>`).join('')}</tbody></table></div>`;
const configs={scenes:{sub:'统一管理设备配置策略，按场景快速应用。',cols:['场景名称','关联设备','最近更新','状态'],rows:[['夜间照护','18 台','今天 09:20','已启用'],['日间活动','24 台','昨天 16:40','已启用'],['安装调试','3 台','今天 11:05','草稿']]},members:{sub:'管理长者档案、入住信息与床位关联。',cols:['姓名','入住位置','关联设备','入住状态'],rows:[['王阿姨','1号楼 / 301房 / 01床','卧室雷达','在住'],['李叔叔','1号楼 / 302房 / 01床','卧室雷达','在住'],['张阿姨','2号楼 / 201房 / 02床','卧室雷达','在住']]},rooms:{sub:'核对房间配置与设备状态，集中定位部署问题。',cols:['房间','区域配置','设备同步','诊断结果'],rows:[['301房','完整','已同步','安装角度待检查'],['302房','完整','已同步','检查正常'],['303房','完整','已同步','检查正常']]},realtime:{sub:'查看平台推送与设备事件，跟踪实时通信状态。',cols:['接收时间','事件类型','来源','消息内容'],rows:[['14:32:08','DeviceData','301房 · 卧室雷达','设备心跳已接收'],['14:32:05','DeviceData','302房 · 卧室雷达','姿态数据已更新'],['14:31:58','Notification','平台服务','区域配置同步成功']]}};const c=configs[id];return `${title(id,c.sub,'<button class="btn" data-demo="数据已刷新">↻ 刷新</button>')}<div class="panel table-wrap" style="margin-top:24px"><table><thead><tr>${c.cols.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${c.rows.map(row=>`<tr>${row.map(s=>`<td>${s}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="quiet" style="margin-top:16px">示例内容 · 可通过顶部标签切换模块，或返回工作台打开其他模块。</p>`}
function deviceDetail(i){selectedDevice=i;content.innerHTML=`<div class="page-title"><div><button class="text-btn" id="back-devices">← 设备列表</button><h1 style="margin-top:16px">${301+i}房 · 卧室雷达 <span class="tag">在线</span></h1><p>1号楼 / 3层 / ${301+i}房　 ·　SN: RD202603010${i+1}</p></div><button class="btn" data-demo="设备参数配置">配置设备</button></div><div class="notice"><span class="warn">●</span><div><b>安装角度偏离推荐范围</b><div class="quiet">当前俯仰角 18°，建议调整至 25°–35°。</div></div><button class="text-btn" data-demo="安装校准">去校准 →</button></div>${stats([['当前状态','在线','ok'],['最近心跳','12','','秒前'],['信号强度','-58','','dBm'],['固件版本','v2.4.1']])}<div class="monitor-grid"><div class="panel"><div class="panel-head"><h2>安装检查</h2></div><table><tbody><tr><td>通信状态</td><td class="ok">正常</td></tr><tr><td>区域配置</td><td class="ok">已同步</td></tr><tr><td>安装角度</td><td class="warn">待校准</td></tr></tbody></table></div><div class="panel"><div class="panel-head"><h2>实时房间状态</h2></div><div class="plan">${plan()}</div></div></div>`}
let toastTimer;function toast(s){const t=document.getElementById('toast');t.textContent=s+' · 样稿演示';t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2600)}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.open)openModule(el.dataset.open);else if(el.dataset.close)closeTab(el.dataset.close);else if(el.dataset.tab){active=el.dataset.tab;render()}else if(el.dataset.device!==undefined)deviceDetail(Number(el.dataset.device));else if(el.dataset.demo)toast(el.dataset.demo);else if(el.hasAttribute('data-help'))document.getElementById('help').showModal();else if(el.id==='close-help')document.getElementById('help').close();else if(el.id==='maximize-window'){const expanded=document.body.classList.toggle('maximized');el.setAttribute('aria-pressed',String(expanded));toast(expanded?'紧凑窗口布局':'标准窗口布局')}else if(el.id==='back-devices')render()});
document.addEventListener('input',e=>{if(e.target.id==='device-search')filterDevices()});document.addEventListener('change',e=>{if(e.target.id==='device-status')filterDevices();if(e.target.matches('.org')){document.getElementById('status-org').textContent=e.target.value;toast('已切换机构展示，当前为示例数据')}});document.addEventListener('keydown',e=>{if(e.altKey&&e.key==='Home'){e.preventDefault();active='home';render()}if(e.altKey&&e.key.toLowerCase()==='w'&&active!=='home'){e.preventDefault();closeTab(active)}});render();
</script>
</body>
</html>
